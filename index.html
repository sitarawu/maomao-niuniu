<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F3F7">
<title>毛毛牛牛健康屋</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
:root{
  --bg:#F5F3F7; --bg2:#EBE7F0; --card:#FDFCFD;
  --ink:#5B5564; --ink2:#9A94A6; --line:#DCD6E6;
  --mao:#E5B8C6; --mao-deep:#C68FA2; --mao-light:#F6DEE6;
  --niu:#A9BEDB; --niu-deep:#8199BB; --niu-light:#D8E4F2;
  --sleep:#A9BADB; --ex:#C0AFDB; --mental:#E3B9CC; --habit:#C9B8DE;
  --gold:#E7C9D9;
  --shadow:#D9D2E6;
  --shadow-ink:#CBC3D6;
}
@font-face{font-family:'Zpix';src:url('https://cdn.jsdelivr.net/gh/SolidZORO/zpix-pixel-font@latest/dist/zpix.ttf') format('truetype');font-display:swap}
.px{font-family:'Zpix',-apple-system,"PingFang SC",sans-serif}
body{
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
  background-image:radial-gradient(rgba(205,195,220,.32) 1px, transparent 1.5px);
  background-size:24px 24px;
}
button{font-family:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink)}

/* topbar */
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 9px;
  background:rgba(245,243,247,.94);backdrop-filter:blur(6px);
  border-bottom:2px solid var(--line);
}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:auto;min-width:0}
.brand b{font-size:16px;letter-spacing:.04em;font-family:'Zpix',"PingFang SC",sans-serif;white-space:nowrap}
.brand span{font-size:10px;color:var(--ink2);letter-spacing:.1em;white-space:nowrap}
.uswitch{display:flex;gap:4px;background:var(--bg2);border-radius:10px;padding:3px;border:2px solid var(--line)}
.uswitch button{
  border:2px solid transparent;background:transparent;font-size:13px;padding:5px 11px;border-radius:8px;
  color:var(--ink2);display:flex;align-items:center;gap:4px;letter-spacing:.02em;transition:.12s;
}
.uswitch button.on{color:#fff;font-weight:700;border-color:var(--ink);box-shadow:2px 2px 0 var(--shadow-ink)}
.uswitch button.on[data-user="maomao"]{background:var(--mao-deep)}
.uswitch button.on[data-user="niuniu"]{background:var(--niu-deep)}
.icon-btn{
  width:36px;height:36px;border-radius:9px;border:2px solid var(--ink);background:var(--card);
  display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none;
  box-shadow:2px 2px 0 var(--shadow-ink);
}
.icon-btn:active{transform:translate(2px,2px);box-shadow:none}

main{padding:10px 14px 26px; max-width:600px; margin:0 auto}

/* hero */
.hero{border-radius:12px;padding:20px 20px 16px;color:#fff;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--shadow-ink);position:relative;overflow:hidden}
.hero-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;position:relative;z-index:1}
.hero-date{font-size:13px;letter-spacing:.05em;opacity:.95}
.hero-user{font-size:13px;font-weight:700;background:rgba(255,255,255,.22);padding:4px 12px;border-radius:8px;display:flex;align-items:center;gap:6px}
.hero-mid{display:flex;align-items:center;gap:18px;position:relative;z-index:1}
.ring-wrap{position:relative;width:118px;height:118px;flex:none}
.ring{width:118px;height:118px}
.ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-num b{font-size:34px;line-height:1;font-weight:700;font-family:'Zpix',monospace}
.ring-num i{font-style:normal;font-size:10px;opacity:.9}
.hero-side{display:flex;flex-direction:column;gap:6px;min-width:0}
.grade{font-size:19px;font-weight:700;font-family:'Zpix',"PingFang SC",sans-serif}
.hero-sub{font-size:12px;opacity:.9}
.hero-streak{font-size:12px;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:8px;align-self:flex-start}
.hero-hint{margin-top:12px;font-size:12px;background:rgba(255,255,255,.2);padding:6px 12px;border-radius:8px;display:inline-block;position:relative;z-index:1}

.starbanner{
  margin-top:12px;border-radius:10px;padding:11px 16px;background:var(--mao-light);color:var(--mao-deep);
  font-size:13.5px;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--shadow-ink);display:flex;align-items:center;gap:6px;
}
.starbanner.poke{background:#F2E9D8;color:#A67C3F}

/* daily challenge */
.challenge{background:var(--card);border-radius:12px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--shadow-ink);padding:14px 16px;margin-top:12px}
.challenge .ch-tag{display:inline-block;font-size:10px;letter-spacing:.06em;color:#fff;background:var(--ex);padding:2px 9px;border-radius:6px;margin-bottom:9px;font-weight:700}
.challenge .ch-main{display:flex;align-items:center;gap:12px}
.challenge .ch-emo{font-size:30px;line-height:1;flex:none}
.challenge .ch-t{font-size:15.5px;font-weight:700;flex:1;line-height:1.35}
.challenge .ch-done{display:flex;gap:8px;margin-top:12px}
.challenge .ch-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--line);border-radius:9px;padding:9px 6px;font-size:12.5px;color:var(--ink2);background:var(--bg);box-shadow:2px 2px 0 var(--shadow)}
.challenge .ch-btn.done{border-color:var(--habit);background:#EFEAF7;color:var(--habit);font-weight:700}
.challenge .ch-btn.mine{border-color:var(--mao-deep);color:var(--mao-deep);font-weight:700}
.challenge .ch-btn.mine.done{border-color:var(--habit);color:var(--habit)}

/* reactions & poke */
.react-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.react-bar button{font-size:22px;border:2px solid var(--line);background:var(--bg);border-radius:9px;width:48px;height:48px;padding:0;line-height:1;transition:.12s;box-shadow:2px 2px 0 var(--shadow)}
.react-bar button:active{transform:translate(2px,2px);box-shadow:none}
.react-count{font-size:12px;color:var(--ink2)}
.poke-btn{display:inline-flex;align-items:center;gap:6px;justify-content:center}

/* win scoreboard */
.win-bar{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:12px}
.win-bar .wbox{flex:1;text-align:center;border-radius:10px;padding:12px 8px;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--shadow-ink)}
.win-bar .wbox b{font-size:26px;display:block;line-height:1.1;font-family:'Zpix',monospace}
.win-bar .wbox span{font-size:11.5px;opacity:.9}
.win-bar .wvs{font-size:16px;color:var(--ink2);font-weight:700;flex:none}
.win-bar .wbox.mao{background:var(--mao-light);color:var(--mao-deep)}
.win-bar .wbox.niu{background:var(--niu-light);color:var(--niu-deep)}

.card{background:var(--card);border-radius:12px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--shadow-ink);padding:16px;margin-top:12px}
.card-title{font-size:14px;font-weight:700;margin-bottom:12px;letter-spacing:.02em;display:flex;align-items:center;gap:6px}

/* category cards */
.cat{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--shadow-ink);padding:14px 16px;margin-top:12px;cursor:pointer;transition:.1s}
.cat:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow-ink)}
.cat-ico{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;border:2px solid var(--ink)}
.cat-mid{flex:1;min-width:0}
.cat-name{font-size:15px;font-weight:700}
.cat-sub{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-score{font-size:22px;font-weight:700;font-family:'Zpix',monospace}
.cat-score span{font-size:11px;font-weight:500;margin-left:1px;opacity:.7}

/* habit chips */
.hchips{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.hchip{
  display:flex;align-items:center;gap:8px;background:var(--bg);border:2px solid var(--line);
  border-radius:10px;padding:10px 12px;cursor:pointer;transition:.1s;user-select:none;box-shadow:2px 2px 0 var(--shadow);
}
.hchip:active{transform:translate(2px,2px);box-shadow:none}
.hchip .hn{font-size:13px;font-weight:600;flex:1}
.hchip .hs{font-size:11px;color:var(--ink2)}
.hchip.done{background:#EFEAF7;border-color:var(--habit)}
.hchip.done .hs{color:var(--habit);font-weight:700}
.hchip.half{background:var(--niu-light);border-color:var(--niu)}
.hchip button{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);background:#fff;font-size:15px;line-height:1;flex:none}
.hchip button:active{transform:scale(.9)}

/* segment */
.seg{display:flex;gap:4px;background:var(--bg2);border-radius:10px;padding:4px;margin-top:12px;border:2px solid var(--line)}
.seg button{flex:1;border:2px solid transparent;background:transparent;padding:7px 0;border-radius:8px;font-size:13px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;border-color:var(--ink);box-shadow:2px 2px 0 var(--shadow-ink)}

/* charts */
.chart-wrap{background:var(--card);border-radius:12px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--shadow-ink);padding:14px;margin-top:12px}
.chart-title{font-size:14px;font-weight:700;margin-bottom:6px}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:#E4DFEC;stroke-width:1}
.chart .axis{fill:#A39CAC;font-size:10px}
.legend{display:flex;gap:14px;justify-content:center;margin-top:8px;font-size:12px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* stats chips */
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.stat{background:var(--card);border-radius:11px;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--shadow-ink);padding:12px;text-align:center}
.stat b{display:block;font-size:19px;line-height:1.2;font-family:'Zpix',monospace}
.stat span{font-size:11px;color:var(--ink2)}

/* avg bar */
.avgbar{margin-top:12px}
.ab-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:5px}
.ab-head b{font-size:14px}
.bar{height:12px;border-radius:4px;background:var(--bg2);overflow:hidden;border:2px solid var(--line)}
.bar i{display:block;height:100%;transition:width .5s}
.cmp-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.cmp-lbl{flex:none;width:64px;font-size:12px;color:var(--ink2)}
.cmp-row .bar{flex:1}

/* verdict */
.verdict{background:var(--card);border-radius:12px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--shadow-ink);padding:16px;margin-top:12px;text-align:center}
.verdict .v-t{font-size:17px;font-weight:700;margin-top:4px}
.verdict .v-s{font-size:12px;color:var(--ink2);margin-top:2px}
.vs{display:flex;gap:10px;margin-top:14px}
.vs .vcard{flex:1;border-radius:10px;padding:12px;text-align:center;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--shadow-ink)}
.vs .vcard b{font-size:24px;display:block;font-family:'Zpix',monospace}
.vs .vcard span{font-size:12px;opacity:.9}
.vcard.mao{background:var(--mao-light);color:var(--mao-deep)}
.vcard.niu{background:var(--niu-light);color:var(--niu-deep)}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.cal-head .m{font-size:16px;font-weight:700}
.cal-head button{width:34px;height:34px;border-radius:9px;border:2px solid var(--ink);background:#fff;font-size:16px;box-shadow:2px 2px 0 var(--shadow-ink)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cal-wd{text-align:center;font-size:11px;color:var(--ink2);padding:4px 0}
.cal{border:2px solid var(--line);aspect-ratio:1;border-radius:7px;font-size:12px;background:var(--bg2);color:var(--ink);position:relative}
.cal.none{background:#EFECF3;color:#B8B1C2}
.cal.s{background:var(--habit);color:#fff;font-weight:700;border-color:var(--ink)}
.cal.a{background:#B9CFDF;color:#fff;font-weight:700;border-color:var(--ink)}
.cal.b{background:#AEC2E8;color:#fff;font-weight:700;border-color:var(--ink)}
.cal.c{background:#CBB9E8;color:#fff;font-weight:700;border-color:var(--ink)}
.cal.d{background:#E8B9C6;color:#fff;font-weight:700;border-color:var(--ink)}
.cal.today{outline:2px solid var(--mao-deep);outline-offset:1px}
.cal-legend{display:flex;gap:8px;justify-content:center;align-items:center;font-size:10.5px;color:var(--ink2);margin-top:10px;flex-wrap:wrap}
.cal-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* notes & wishes */
.note{background:var(--card);border-radius:11px;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--shadow-ink);padding:13px 15px;margin-top:10px}
.note .n-head{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2)}
.note .n-head b{color:var(--ink)}
.note .n-body{font-size:14.5px;margin:7px 0 4px;white-space:pre-wrap;word-break:break-word}
.note .n-foot{font-size:11px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.note .n-del{margin-left:auto;color:var(--ink2);border:0;background:transparent;font-size:11px}
.note img{max-width:100%;border-radius:8px;margin-top:8px}
.note.mao{border-left:5px solid var(--mao-deep)}
.note.niu{border-left:5px solid var(--niu-deep)}
.wish{background:var(--card);border-radius:11px;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--shadow-ink);padding:12px 14px;margin-top:10px;display:flex;align-items:center;gap:10px}
.wish .w-body{flex:1;min-width:0}
.wish .w-text{font-size:14.5px;word-break:break-word}
.wish .w-text.done{text-decoration:line-through;color:var(--ink2)}
.wish .w-meta{font-size:11px;color:var(--ink2);margin-top:2px}
.wish .w-btn{border:2px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:11px;color:var(--ink2);flex:none;box-shadow:1px 1px 0 var(--shadow)}
.wish .w-btn.on{border-color:var(--habit);background:#EFEAF7;color:var(--habit)}

/* badges */
.badges{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-top:10px}
.badge{flex:none;width:96px;background:var(--card);border-radius:10px;box-shadow:2px 2px 0 var(--shadow-ink);padding:10px 6px;text-align:center;border:2px solid var(--line)}
.badge .bl{font-size:11px;font-weight:700;line-height:1.35}
.badge .bs{font-size:10px;color:var(--ink2);margin-top:3px}
.badge.done{border-color:var(--habit);background:#EFEAF7}
.badge.done .bs{color:var(--habit)}
.badge.lock{opacity:.45}

/* form */
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:5px;font-weight:600}
.field input[type=text],.field input[type=number],.field textarea,.field select{
  width:100%;border:2px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--card);outline:none;box-shadow:2px 2px 0 var(--shadow);
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--mao-deep)}
.field textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px}
.row .field{flex:1}
.time-select{display:flex;gap:6px;align-items:center}
.time-select select{flex:1;border:2px solid var(--line);border-radius:9px;padding:9px 6px;background:var(--card);font-size:14px;outline:none;box-shadow:2px 2px 0 var(--shadow);text-align:center}
.time-select span{color:var(--ink2);font-weight:700}
.btn{
  width:100%;border:2px solid var(--ink);border-radius:10px;padding:13px;font-size:15px;font-weight:700;color:#fff;margin-top:6px;
  background:var(--mao-deep);box-shadow:3px 3px 0 var(--shadow-ink);font-family:'Zpix',"PingFang SC",sans-serif;
}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.gray{background:#C9C2D2;color:var(--ink)}
.btn.small{width:auto;padding:8px 16px;font-size:13px;border-radius:9px;margin-top:0;box-shadow:2px 2px 0 var(--shadow-ink)}
.exitem{display:flex;align-items:center;gap:10px;background:var(--bg);border:2px solid var(--line);border-radius:9px;padding:9px 12px;margin-top:8px;font-size:13px}
.exitem .xr{margin-left:auto;color:var(--ink2);border:0;background:transparent;font-size:12px}

/* stars */
.stars{display:flex;gap:8px;font-size:26px}
.stars button{border:0;background:transparent;font-size:24px;padding:0;filter:grayscale(1);opacity:.4}
.stars button.on{filter:none;opacity:1;color:var(--gold)}

/* modal / sheet */
#modal-root{position:fixed;inset:0;z-index:60;display:none}
#modal-root.open{display:block}
.modal-backdrop{position:absolute;inset:0;background:rgba(60,54,70,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{
  background:var(--bg);width:100%;max-width:600px;max-height:94vh;overflow:auto;
  border-radius:16px 16px 0 0;border-top:3px solid var(--ink);padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  animation:up .24s steps(6,end);
}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-head .sh-title{font-size:17px;font-weight:700;margin-right:auto}
.sheet-head .close{width:34px;height:34px;border-radius:9px;border:2px solid var(--ink);background:#fff;font-size:15px;box-shadow:2px 2px 0 var(--shadow-ink)}
.sect{margin-top:16px}
.sect-h{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:10px}
.hours-hint{font-size:12px;color:var(--mao-deep);font-weight:700}
.photo-preview{margin-top:8px}
.photo-preview img{max-width:100%;max-height:200px;border-radius:8px}
.photo-preview .rm{display:inline-block;margin-top:6px;font-size:12px;color:var(--ink2)}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:#fff;font-size:13.5px;padding:11px 18px;border-radius:10px;z-index:80;
  border:2px solid var(--ink);box-shadow:2px 2px 0 var(--shadow-ink);
  opacity:0;transition:.25s;pointer-events:none;max-width:86vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%)}

/* tabbar */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  background:rgba(245,243,247,.98);border-top:2px solid var(--line);
}
.tab{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;color:var(--ink2);font-size:10.5px;letter-spacing:.03em}
.tab .ti{line-height:1.2}
.tab .ti svg{width:22px;height:22px;display:block}
.tab.on{color:var(--mao-deep);font-weight:700}

/* avatar & pixel art */
.avatar{width:24px;height:24px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex:none;border:2px solid var(--ink)}
.avatar.sm{width:20px;height:20px;font-size:11px}
.px-ava{display:inline-flex;vertical-align:middle;flex:none}
.px-ava svg{display:block;image-rendering:pixelated}
.ci{display:inline-flex;align-items:center;justify-content:center;flex:none}
.ci svg{image-rendering:pixelated;display:block}
.cat-ico svg{image-rendering:pixelated;display:block}
.icon-btn svg{width:19px;height:19px}
.sect-h .ci svg{image-rendering:pixelated}
.uswitch button.on .avatar{background:#fff;color:var(--ink);border-color:var(--ink)}
.rest-tag{display:inline-block;font-size:12px;color:var(--ink2);background:var(--bg2);padding:2px 10px;border-radius:7px}

/* 像素装饰点缀 */
.deco{position:absolute;pointer-events:none;opacity:.85}

function tint(hex,a){
  var h=String(hex||'').replace('#','');

  var r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  if(isNaN(r)||isNaN(g)||isNaN(b))return 'rgba(154,144,134,'+a+')';

function normalize(s){
  s=s||{};
  s.version=1;
  s.settings=Object.assign(defaultSettings(),s.settings||{});
  if(!s.days||typeof s.days!=='object')s.days={};
  USER_IDS.forEach(function(u){if(!s.days[u]||typeof s.days[u]!=='object')s.days[u]={}});

  if(!s.challenges||typeof s.challenges!=='object')s.challenges={};
  if(!Array.isArray(s.wishes))s.wishes=[];
  return s;
}

function applyOp(s,type,payload){
  s=normalize(s);
  if(type==='setDay'){
    var rec=payload.record||emptyRecord();
    s.days[payload.user]=s.days[payload.user]||{};
    s.days[payload.user][payload.date]=rec;
  }
  else if(type==='deleteDay'){delete s.days[payload.user][payload.date]}
  else if(type==='addNote'){s.notes.unshift(payload.note)}
  else if(type==='deleteNote'){s.notes=s.notes.filter(function(n){return n.id!==payload.id})}
  else if(type==='updateSettings'){s.settings=Object.assign({},s.settings,payload)}
  else if(type==='react'){s.reactions.unshift(payload.reaction)}
  else if(type==='poke'){var pk=payload.poke;s.pokes[pk.date+'|'+pk.to]=pk}
  else if(type==='addWish'){s.wishes.unshift(payload.wish)}
  else if(type==='deleteWish'){s.wishes=s.wishes.filter(function(w){return w.id!==payload.id})}
  else if(type==='toggleWish'){var i=s.wishes.findIndex(function(w){return w.id===payload.id});if(i>=0)s.wishes[i].done=!s.wishes[i].done}
  else if(type==='setChallenge'){s.challenges[payload.date]=s.challenges[payload.date]||{};s.challenges[payload.date][payload.user]=payload.done}
  else if(type==='replaceState'){s=normalize(payload)}
  return s;
}
async function op(type,payload){
  if(apiMode==='cloud'){
    try{
      var cur=null;
      try{cur=await sbGet()}catch(e){}
      store=normalize(applyOp(cur||null,type,payload));
      await sbSet(store);
    }catch(e){toast('云端同步失败，请检查网络');return}
  }else if(apiMode==='server'){
    try{
      var r=await fetch('api/op',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:type,payload:payload})});
      var j=await r.json();
      if(j&&j.state)store=normalize(j.state);
    }catch(e){toast('同步失败，请检查网络');return}
  }else{
    store=applyOp(store,type,payload);
    try{localStorage.setItem('healthhouse_store',JSON.stringify(store))}catch(e){toast('本机存储已满，建议导出备份')}
  }
  render();
}

  try{
    var data=await sbGet();
    if(data){
      var changed=!store||!store._syncedAt||(data._syncedAt!==store._syncedAt);
      if(force||changed){
        store=normalize(data);
        var mr=$('#modal-root');
        if(!(mr&&mr.classList.contains('open')))render();
        if(force)toast('已刷新');
      }
      else if(force){toast('数据已是最新')}
    }else if(force){toast('云端还没有数据')}
  }catch(e){if(force)toast('刷新失败，请检查网络')}
}

  if(cloudTimer)clearInterval(cloudTimer);

/* ---------- scoring ---------- */
function sleepScore(s){
  if(!s||!s.hours)return 0;
  var h=Number(s.hours)||0, dur=0;
  if(h>=7&&h<=9)dur=60;
  else if((h>=6.5&&h<7)||(h>9&&h<=9.5))dur=50;
  else if((h>=6&&h<6.5)||(h>9.5&&h<=10))dur=38;
  else if((h>=5&&h<6)||(h>10&&h<=11))dur=24;
  else if(h>0)dur=12;
  var bed=0;
  if(s.bedtime){
    var p=String(s.bedtime).split(':'),mins=(Number(p[0])||0)*60+(Number(p[1])||0);
    if(mins<12*60)mins+=24*60;
    if(mins<=22*60+30)bed=25;
    else if(mins<=23*60)bed=22;
    else if(mins<=23*60+59)bed=17;
    else if(mins<=25*60)bed=12;
    else bed=6;
  }
  var q=Math.max(0,Math.min(5,Number(s.quality)||0))*3;
  return dur+bed+q;
}
function exerciseScore(list){
  if(!list||!list.length)return 0;
  var total=0,cats={};
  list.forEach(function(e){
    total+=Number(e.min)||0;
    var c=e.cat||e.type||'其它';
    if(c)cats[c]=1;
  });
  var dur=0;
  if(total>=60)dur=70;else if(total>=45)dur=60;else if(total>=30)dur=50;
  else if(total>=20)dur=38;else if(total>=10)dur=22;else dur=10;
  var ncat=Object.keys(cats).length;
  var bal=ncat>=2?30:(ncat===1?18:0);
  return dur+bal;
}
function mentalScore(m){
  if(!m)return 0;
  var b=(m.book&&String(m.book).trim())?35:0;
  var mv=(m.movie&&String(m.movie).trim())?30:0;
  var id=(m.idea&&String(m.idea).trim())?35:0;
  return b+mv+id;
}
function habitsScore(h){
  if(!h)return 0;
  var total=0;
  HABITS.forEach(function(hb){
    var v=h[hb.id];
    if(hb.type==='step'){
      var goal=Number(store.settings.waterGoal)||8;
      total+=Math.min(1,(Number(v)||0)/goal)*hb.w;
    }else if(hb.type==='tri'){
      total+=((Number(v)||0)/2)*hb.w;
    }else{
      total+=(v?1:0)*hb.w;
    }
  });
  return Math.round(Math.min(100,total));
}
function scoresOf(user,date){
  var r=dayOf(user,date);
  var sleep=r&&r.sleep?sleepScore(r.sleep):0;
  var exercise=(r&&r.exercise&&r.exercise.length)?exerciseScore(r.exercise):0;
  var mental=r&&r.mental?mentalScore(r.mental):0;
  var habits=r&&r.habits?habitsScore(r.habits):0;
  var overall=Math.round(0.25*sleep+0.25*exercise+0.2*mental+0.3*habits);
  var complete=0;
  if(r&&r.sleep&&r.sleep.hours)complete++;
  if(r&&(r.rest||(r.exercise&&r.exercise.length)))complete++;
  if(r&&r.mental&&((r.mental.book&&r.mental.book.trim())||(r.mental.movie&&r.mental.movie.trim())||(r.mental.idea&&r.mental.idea.trim())))complete++;
  if(r&&r.habits)complete++;
  return {sleep:Math.round(sleep),exercise:Math.round(exercise),mental:Math.round(mental),habits:Math.round(habits),overall:overall,complete:complete};
}
function grade(s){
  if(s>=90)return {l:'S',t:'健康王者'};
  if(s>=80)return {l:'A',t:'活力满满'};
  if(s>=70)return {l:'B',t:'状态良好'};
  if(s>=60)return {l:'C',t:'及格啦'};
  return {l:'D',t:'要加油啦'};
}
function streakOf(user){
  var set={};recordedDays(user).forEach(function(d){set[d]=1});
  if(!Object.keys(set).length)return 0;
  var cur=new Date();
  if(!set[fmt(cur)])cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()-1);
  var s=0;
  while(set[fmt(cur)]){s++;cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()-1)}
  return s;
}
function starOf(date){
  var a=scoresOf('maomao',date).overall, b=scoresOf('niuniu',date).overall;
  if(a===0&&b===0)return null;
  return a>=b?'maomao':'niuniu';
}
function challengeOf(date){
  var n=0;for(var i=0;i<date.length;i++)n=(n*31+date.charCodeAt(i))>>>0;
  return CHALLENGES[n%CHALLENGES.length];
}
function currentWeekDays(){
  var now=new Date();
  var day=(now.getDay()+6)%7;
  var mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-day);
  var arr=[];
  for(var i=0;i<7;i++){var x=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i);arr.push(fmt(x))}
  return arr;
}
function weeklyWins(){
  var weeks={}, seen={};
  USER_IDS.forEach(function(u){recordedDays(u).forEach(function(d){seen[d]=1})});
  Object.keys(seen).forEach(function(d){
    var p=d.split('-').map(Number);
    var dt=new Date(p[0],p[1]-1,p[2]);
    var wd=(dt.getDay()+6)%7;
    var mon=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()-wd);
    var key=fmt(mon);
    weeks[key]=weeks[key]||[];weeks[key].push(d);
  });
  var wins={maomao:0,niuniu:0,draw:0};
  Object.keys(weeks).forEach(function(wk){
    var days=weeks[wk];
    var a=overallAvg('maomao',days), b=overallAvg('niuniu',days);
    if(a===0&&b===0)return;
    if(a===b){wins.draw++;return}
    if(a>b)wins.maomao++;else wins.niuniu++;
  });
  return wins;
}
function reactionsTo(user,date){
  return store.reactions.filter(function(r){return r.to===user&&r.date===date});
}
function challengeStatus(date){
  var c=store.challenges[date]||{};
  return {maomao:!!c.maomao,niuniu:!!c.niuniu};
}
function catAvg(user,days,cat){
  var rec=days.filter(function(d){return dayHas(user,d)});
  if(!rec.length)return 0;
  return Math.round(rec.reduce(function(a,d){return a+scoresOf(user,d)[cat]},0)/rec.length);
}
function overallAvg(user,days){
  var rec=days.filter(function(d){return dayHas(user,d)});
  if(!rec.length)return 0;
  return Math.round(rec.reduce(function(a,d){return a+scoresOf(user,d).overall},0)/rec.length);
}
function dayExerciseMin(user,date){
  var r=dayOf(user,date);
  return r&&r.exercise?r.exercise.reduce(function(a,e){return a+(Number(e.min)||0)},0):0;
}

/* ---------- charts ---------- */
function lineChart(el,labels,series,showDots){
  var W=560,H=240,padL=32,padR=12,padT=14,padB=26;
  var iw=W-padL-padR,ih=H-padT-padB,n=labels.length,ymax=100;
  var svg='<svg viewBox="0 0 '+W+' '+H+'" class="chart" preserveAspectRatio="xMidYMid meet">';
  for(var g=0;g<=4;g++){
    var y=padT+ih-(g/4)*ih, val=Math.round(g/4*ymax);
    svg+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" class="grid"/>';
    svg+='<text x="'+(padL-7)+'" y="'+(y+3)+'" class="axis" text-anchor="end">'+val+'</text>';
  }
  var step=Math.max(1,Math.ceil(n/6));
  for(var i=0;i<n;i+=step){
    var xx=padL+(n===1?iw/2:iw*(i/(n-1)));
    svg+='<text x="'+xx+'" y="'+(H-padB+15)+'" class="axis" text-anchor="middle">'+shortDate(labels[i])+'</text>';
  }
  series.forEach(function(s){
    var pts=[];
    for(var i=0;i<n;i++){
      var v=Math.max(0,Math.min(ymax,Number(s.values[i])||0));
      var x=padL+(n===1?iw/2:iw*(i/(n-1)));
      var y=padT+ih-(v/ymax)*ih;
      pts.push(x+','+y);
    }
    svg+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+s.color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
    if(series.length===1)svg+='<polygon points="'+padL+','+(padT+ih)+' '+pts.join(' ')+' '+(W-padR)+','+(padT+ih)+'" fill="'+tint(s.color,0.10)+'"/>';
    if(showDots!==false){
      for(var j=0;j<n;j++){
        var v2=Math.max(0,Math.min(ymax,Number(s.values[j])||0));
        var x2=padL+(n===1?iw/2:iw*(j/(n-1)));
        var y2=padT+ih-(v2/ymax)*ih;
        svg+='<circle cx="'+x2+'" cy="'+y2+'" r="3.2" fill="'+s.color+'"><title>'+labels[j]+' · '+Math.round(s.values[j])+'分</title></circle>';
      }
    }
  });
  svg+='</svg>';
  if(series.length>1)svg+='<div class="legend">'+series.map(function(s){return '<span><i style="background:'+s.color+'"></i>'+s.name+'</span>'}).join('')+'</div>';
  el.innerHTML=svg;
}
function radarChart(el,axes,series){
  var W=340,H=300,cx=W/2,cy=H/2,r=96;
  var svg='<svg viewBox="0 0 '+W+' '+H+'" class="chart" preserveAspectRatio="xMidYMid meet">';
  for(var g=1;g<=4;g++){
    var rr=r*g/4, pts=[];
    for(var i=0;i<axes.length;i++){
      var ang=-Math.PI/2+i*2*Math.PI/axes.length;
      pts.push((cx+rr*Math.cos(ang))+','+(cy+rr*Math.sin(ang)));
    }
    svg+='<polygon points="'+pts.join(' ')+'" fill="none" stroke="#EAE4DB" stroke-width="1"/>';
  }
  for(var a=0;a<axes.length;a++){
    var ang2=-Math.PI/2+a*2*Math.PI/axes.length;
    svg+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+r*Math.cos(ang2))+'" y2="'+(cy+r*Math.sin(ang2))+'" stroke="#EAE4DB" stroke-width="1"/>';
    var lx=cx+(r+26)*Math.cos(ang2), ly=cy+(r+26)*Math.sin(ang2);
    svg+='<text x="'+lx+'" y="'+(ly+4)+'" text-anchor="middle" class="axis" font-size="12">'+axes[a].label+'</text>';
  }
  series.forEach(function(s){
    var pts=[];
    for(var i=0;i<axes.length;i++){
      var v=Math.max(0,Math.min(100,Number(s.values[i])||0));
      var rr=r*v/100;
      var ang=-Math.PI/2+i*2*Math.PI/axes.length;
      pts.push((cx+rr*Math.cos(ang))+','+(cy+rr*Math.sin(ang)));
    }
    svg+='<polygon points="'+pts.join(' ')+'" fill="'+tint(s.color,0.22)+'" stroke="'+s.color+'" stroke-width="2.2"/>';
  });
  svg+='</svg>';
  svg+='<div class="legend">'+series.map(function(s){return '<span><i style="background:'+s.color+'"></i>'+s.name+'</span>'}).join('')+'</div>';
  el.innerHTML=svg;
}
function ring(score,color){
  var pct=Math.max(0,Math.min(100,score||0)),r=52,c=2*Math.PI*r,dash=c*pct/100;
  return '<svg viewBox="0 0 120 120" class="ring">'+
    '<circle cx="60" cy="60" r="'+r+'" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="10"/>'+
    '<circle cx="60" cy="60" r="'+r+'" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+dash+' '+c+'" transform="rotate(-90 60 60)"/>'+
    '</svg>';
}

function categoryCard(c,rec,sc){
  var detail='';
  if(c.id==='sleep'){
    detail = rec&&rec.sleep&&rec.sleep.hours ? ('睡了 '+rec.sleep.hours+' 小时'+(rec.sleep.bedtime?(' · '+rec.sleep.bedtime+' 睡'):'')) : '还没记录昨晚的睡眠';
  }else if(c.id==='exercise'){
    if(rec&&rec.rest){detail='休息日 · 今天没锻炼'}
    else{
      var mins=dayExerciseMin(ui.user,todayStr());
      detail = mins ? ('共 '+mins+' 分钟'+(rec&&rec.exercise?(' · '+rec.exercise.length+' 项'):'')) : '今天还没动起来';

function badgesOf(user){
  var b=[], streak=streakOf(user);
  b.push({l:'连续打卡 7 天',done:streak>=7});
  b.push({l:'连续打卡 30 天',done:streak>=30});
  var days7=lastNDays(7), ex=days7.reduce(function(a,d){return a+dayExerciseMin(user,d)},0);
  b.push({l:'本周运动 '+(Number(store.settings.exerciseGoal)||150)+' 分钟',done:ex>=(Number(store.settings.exerciseGoal)||150)});
  var readN=recordedDays(user).filter(function(d){var m=dayOf(user,d).mental;return m&&(m.book&&String(m.book).trim())}).length;
  b.push({l:'累计阅读 10 次',done:readN>=10});
  var top=recordedDays(user).some(function(d){return scoresOf(user,d).overall>=90});
  b.push({l:'单日综合 90+',done:top});
  return b;
}

function timeSelects(prefix,value){
  var h=0,m=0;
  if(value){var p=String(value).split(':');h=parseInt(p[0],10)||0;m=parseInt(p[1],10)||0;}
  var hh='<select id="'+prefix+'-h">';
  for(var i=0;i<24;i++)hh+='<option value="'+i+'"'+(i===h?' selected':'')+'>'+pad(i)+'</option>';
  hh+='</select>';
  var near=Math.min(45,Math.round(m/15)*15);
  var mm='<select id="'+prefix+'-m">';
  [0,15,30,45].forEach(function(v){mm+='<option value="'+v+'"'+(v===near?' selected':'')+'>'+pad(v)+'</option>'});
  mm+='</select>';
  return '<div class="time-select">'+hh+'<span>:</span>'+mm+'</div>';
}
function readTime(prefix){
  var h=$('#'+prefix+'-h'), m=$('#'+prefix+'-m');
  if(!h||!m)return '';
  return pad(parseInt(h.value,10)||0)+':'+pad(parseInt(m.value,10)||0);
}

  else if(v==='pk')html=viewPK();
  else if(v==='interact')html=viewInteract();
  $('#view').innerHTML=html;
  $$('.tab').forEach(function(t){t.classList.toggle('on',t.dataset.nav===v)});
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target;
  if(!t||!t.closest)return;
  var nav=t.closest('[data-nav]');
  if(nav){ui.view=nav.dataset.nav;render();return}
  var ub=t.closest('#uswitch button');
  if(ub){ui.user=ub.dataset.user;try{localStorage.setItem('healthhouse_user',ui.user)}catch(e){}render();return}
  if(t.classList&&t.classList.contains('modal-backdrop')){closeModal();return}
  if(t.closest('[data-close]')){closeModal();return}
  var mb=t.closest('[data-month]');
  if(mb){
    var p=ui.month.split('-').map(Number);
    var d=new Date(p[0],p[1]-1+Number(mb.dataset.month),1);
    ui.month=ymOf(d);render();return;
  }
  var pb=t.closest('[data-period]');
  if(pb){ui.period=Number(pb.dataset.period);render();return}
  var act=t.closest('[data-action]');
  if(!act)return;
  var a=act.dataset.action;
  if(a==='settings')openSettings();
  else if(a==='open-day')openDay(act.dataset.date);
  else if(a==='send-note')sendNote();
  else if(a==='delete-note')delNote(act.dataset.id);
  else if(a==='send-wish')sendWish();
  else if(a==='toggle-wish')toggleWish(act.dataset.id);
  else if(a==='delete-wish')delWish(act.dataset.id);
  else if(a==='react')doReact(act.dataset.id);
  else if(a==='poke')doPoke();
  else if(a==='toggle-challenge')toggleChallenge();
  else if(a==='save-settings')saveSettings();
  else if(a==='refresh-cloud')refreshCloud(true);
  else if(a==='export')exportData();
  else if(a==='import')$('#import-file').click();
  else if(a==='save-day')saveSheet();
  else if(a==='delete-day')deleteDay();
  else if(a==='quick-habit')quickHabitToggle(act.dataset.hid);
  else if(a==='quick-water')quickWater(act.dataset.hid,Number(act.dataset.dir));
  else if(a==='quick-joy')openJoy('quick');
  else if(a==='sh-joy')openJoy('sheet');
  else if(a==='save-joy')saveJoy();
  else if(a==='sh-habit'){
    var hb=HABITS.filter(function(x){return x.id===act.dataset.hid})[0];
    sheet.rec.habits=sheet.rec.habits||{};
    if(hb.type==='tri')sheet.rec.habits[hb.id]=((sheet.rec.habits[hb.id]||0)+1)%3;
    else if(hb.type==='bool')sheet.rec.habits[hb.id]=!sheet.rec.habits[hb.id];
    var eh=$('#sh-habits');if(eh)eh.innerHTML=habitChips(sheet.rec.habits,'sheet');
  }
  else if(a==='sh-water'){
    sheet.rec.habits=sheet.rec.habits||{};
    var v=(sheet.rec.habits[act.dataset.hid]||0)+Number(act.dataset.dir);
    sheet.rec.habits[act.dataset.hid]=Math.max(0,Math.min(20,v));
    var ew=$('#sh-habits');if(ew)ew.innerHTML=habitChips(sheet.rec.habits,'sheet');
  }
  else if(a==='sh-star'){
    sheet.rec.sleep.quality=Number(act.dataset.v);
    renderSheetStars();
  }
  else if(a==='sh-ex-add'){
    var item=($('#sh-ex-type').value||'').trim();
    var min=Number($('#sh-ex-min').value)||0;
    if(!item){toast('请选择运动项目');return}
    if(min<=0){toast('填一下运动分钟数');return}
    sheet.rec.exercise=sheet.rec.exercise||[];
    sheet.rec.exercise.push({cat:exCat(item),item:item,min:min});
    $('#sh-ex-min').value='';
    renderSheetExercise();
  }
  else if(a==='sh-ex-del'){
    sheet.rec.exercise.splice(Number(act.dataset.i),1);
    renderSheetExercise();
  }
  else if(a==='sh-photo-add')$('#sh-photo-input').click();
  else if(a==='sh-photo-clear'){sheet.rec.mental.photo='';renderSheetPhoto()}
});
document.addEventListener('input',function(e){
  var t=e.target;
});
document.addEventListener('change',async function(e){
  var t=e.target;
  if(t.id==='sh-bedtime-h'||t.id==='sh-bedtime-m'||t.id==='sh-wake-h'||t.id==='sh-wake-m'){updateHoursHint()}
  if(t.id==='sh-rest'){sheet.rec.rest=t.checked;renderSheetExercise()}
  if(t.id==='sh-photo-input'){
    var file=t.files&&t.files[0];if(!file)return;
    try{
      sheet.rec.mental.photo=await compressImage(file,1280,0.72);
      renderSheetPhoto();
    }catch(err){toast('图片处理失败，换个格式试试')}
  }
  if(t.id==='import-file'){
    var f=t.files&&t.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=async function(){
      try{var data=JSON.parse(r.result);await op('replaceState',data);closeModal();toast('导入成功')}catch(err){toast('文件格式不对')}
    };
    r.readAsText(f);
  }
});

function compressImage(file,maxDim,quality){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onload=function(){
      var img=new Image();
      img.onload=function(){
        var w=img.width,h=img.height,scale=Math.min(1,maxDim/Math.max(w,h));
        w=Math.round(w*scale);h=Math.round(h*scale);
        var c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.onerror=reject;
      img.src=reader.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

/* ---------- boot ---------- */
(async function(){
  try{var su=localStorage.getItem('healthhouse_user');if(su==='maomao'||su==='niuniu')ui.user=su}catch(e){}
  $$('[data-px]').forEach(function(el){el.innerHTML=pixelSVG(PIXEL[el.dataset.px],PIXEL_COLOR[el.dataset.px],3)});
  injectDecor();
  store=normalize(await load());
  render();
  if(apiMode==='cloud')startCloudSync();
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')refreshCloud(false)});
})();

})();
</script>
